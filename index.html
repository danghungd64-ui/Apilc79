<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TXMD5 Lite Sessions + Analysis</title>
<style>
  *{box-sizing:border-box}
  body{font-family:system-ui,-apple-system,sans-serif;background:#0b0e13;color:#e6e6e6;margin:0;padding:16px;max-width:900px;margin:auto}
  h1{font-size:18px;margin:8px 0}
  h2{font-size:14px;margin:16px 0 8px;opacity:.85}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  button{background:#2563eb;color:#fff;border:0;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.ghost{background:#1e2330}
  #status{font-size:13px;opacity:.75}
  .card{background:#151922;border:1px solid #232938;border-radius:10px;padding:12px;margin:8px 0}
  .row{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px dashed #232938}
  .row:last-child{border:0}
  .tai{color:#4ade80;font-weight:700}
  .xiu{color:#f87171;font-weight:700}
  .err{color:#fca5a5}.ok{color:#4ade80}
  pre{background:#0f131a;border:1px solid #232938;border-radius:8px;padding:10px;overflow:auto;font-size:12px;max-height:400px;white-space:pre-wrap;word-break:break-all}
  details{margin-top:12px}summary{cursor:pointer;opacity:.8;font-size:13px;margin-bottom:6px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .stat{background:#151922;border:1px solid #232938;border-radius:10px;padding:10px;text-align:center}
  .stat .v{font-size:22px;font-weight:700;margin-top:4px}
  .stat .k{font-size:12px;opacity:.7}
  .note{font-size:12px;color:#fbbf24;background:#2a1f08;border:1px solid #4a3610;padding:8px;border-radius:8px;margin:8px 0}
</style>
</head>
<body>

<h1>🎲 TXMD5 Lite Sessions + Phân tích</h1>

<div class="bar">
  <button id="btnLoad">🔄 Tải lại</button>
  <button id="btnAuto" class="ghost">▶ Auto 10s</button>
  <span id="status">Chưa tải</span>
</div>

<div class="note">
  ⚠️ Đây là <b>phân tích thống kê lịch sử</b> từ dữ liệu JSON trả về.
  <b>Không phải dự đoán</b> — game RNG không dự đoán được. Không dùng để đặt cược.
</div>

<h2>📊 Thống kê tổng quan</h2>
<div class="grid" id="stats"></div>

<h2>🔗 Chuỗi & cầu (từ dữ liệu)</h2>
<div id="streak"></div>

<h2>📋 Danh sách phiên</h2>
<div id="list"></div>

<details>
  <summary>🔍 Raw JSON (debug)</summary>
  <pre id="raw">—</pre>
</details>

<script>
/* ============================================================
   CẤU HÌNH
   ============================================================ */
const CONFIG = {
  // Repo PUBLIC → KHÔNG để token thật. Dùng Worker proxy (README).
  API_URL: 'https://wtxmd52.tele68.com/v1/txmd5/lite-sessions?cp=R&cl=R&pf=web&at=ab36a88e2c9868ae0e8bc61adbd18dc',
  AUTO_MS: 10000,
  MAX_ITEMS: 50
};

/* ============================================================
   DOM
   ============================================================ */
const $status = document.getElementById('status');
const $list   = document.getElementById('list');
const $stats  = document.getElementById('stats');
const $streak = document.getElementById('streak');
const $raw    = document.getElementById('raw');
const btnLoad = document.getElementById('btnLoad');
const btnAuto = document.getElementById('btnAuto');
let autoTimer = null, loading = false;

/* ============================================================
   TẢI DỮ LIỆU
   ============================================================ */
async function load() {
  if (loading) return;
  loading = true; btnLoad.disabled = true;
  $status.textContent = '⏳ Đang tải...';

  try {
    const res = await fetch(CONFIG.API_URL, {
      method: 'GET', headers: { 'Accept': 'application/json' },
      credentials: 'omit', cache: 'no-store'
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);

    const text = await res.text();
    $raw.textContent = text;

    let data; try { data = JSON.parse(text); }
    catch { throw new Error('Response không phải JSON'); }

    const items = extractList(data);
    const norm  = items.map(normalize);          // chuẩn hóa về {id, side, sum, dice}
    renderStats(norm);
    renderStreak(norm);
    renderList(norm);

    $status.innerHTML = '<span class="ok">✅ OK</span> · ' + items.length +
      ' phiên · ' + new Date().toLocaleTimeString();
  } catch (e) {
    console.error(e);
    $status.innerHTML = '<span class="err">❌ ' + e.message + '</span>';
    $list.innerHTML = `<div class="card err">Lỗi: <b>${e.message}</b><br>
      <small>Có thể do CORS → dùng Worker proxy (xem README).</small></div>`;
  } finally {
    loading = false; btnLoad.disabled = false;
  }
}

/* ============================================================
   CHUẨN HÓA: lấy side = 'tai' | 'xiu' | null
   ============================================================ */
function normalize(it) {
  const rawResult = pick(it, ['result','ketQua','ket_qua','outcome','value','side']);
  const sum       = pick(it, ['sum','tong','total','point']);
  const dice      = pick(it, ['dice','xucXac','xuc_xac','values','numbers']);
  const id        = pick(it, ['id','session','sessionId','phien','round','issue']);

  let side = null;
  const r = String(rawResult ?? '').toLowerCase();
  if (/tai|tài|big|over|^1$/.test(r)) side = 'tai';
  else if (/xiu|xỉu|small|under|^0$/.test(r)) side = 'xiu';
  else if (sum != null) side = Number(sum) >= 11 ? 'tai' : 'xiu'; // Tài Xỉu: >=11 là Tài

  return { id, side, sum: sum ?? null, dice: dice ?? null, raw: rawResult };
}

/* ============================================================
   THỐNG KÊ (không phải dự đoán)
   ============================================================ */
function renderStats(items) {
  const total = items.length;
  const tai = items.filter(x => x.side === 'tai').length;
  const xiu = items.filter(x => x.side === 'xiu').length;
  const pTai = total ? (tai / total * 100).toFixed(1) : '0';
  const pXiu = total ? (xiu / total * 100).toFixed(1) : '0';

  const sums = items.map(x => x.sum).filter(v => v != null && !isNaN(v));
  const avgSum = sums.length ? (sums.reduce((a,b)=>a+b,0)/sums.length).toFixed(2) : '-';

  // đếm số lần xuất hiện của từng tổng 3..18
  const freq = {};
  sums.forEach(s => freq[s] = (freq[s]||0)+1);
  const topSum = Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,3)
    .map(([k,v])=>`${k} (${v}×)`).join(', ') || '-';

  $stats.innerHTML = `
    <div class="stat"><div class="k">Tổng phiên</div><div class="v">${total}</div></div>
    <div class="stat"><div class="k">Tổng điểm TB</div><div class="v">${avgSum}</div></div>
    <div class="stat"><div class="k">Tài</div><div class="v tai">${tai} · ${pTai}%</div></div>
    <div class="stat"><div class="k">Xỉu</div><div class="v xiu">${xiu} · ${pXiu}%</div></div>
    <div class="stat" style="grid-column:1/-1"><div class="k">Tổng xuất hiện nhiều nhất</div><div class="v" style="font-size:15px">${topSum}</div></div>
  `;
}

/* ============================================================
   CHUỖI / CẦU — chỉ mô tả quá khứ
   ============================================================ */
function renderStreak(items) {
  const seq = items.map(x => x.side).filter(Boolean);
  if (!seq.length) { $streak.innerHTML = '<div class="card">Không đủ dữ liệu</div>'; return; }

  // chuỗi hiện tại (từ đầu mảng — thường API trả mới nhất trước)
  let cur = seq[0], len = 0;
  for (const s of seq) { if (s === cur) len++; else break; }

  // độ dài các chuỗi trong lịch sử
  const runs = []; let prev = seq[0], n = 1;
  for (let i=1;i<seq.length;i++) {
    if (seq[i] === prev) n++;
    else { runs.push({ side: prev, len: n }); prev = seq[i]; n = 1; }
  }
  runs.push({ side: prev, len: n });

  const maxRun = runs.reduce((a,b)=> b.len > a.len ? b : a, runs[0]);
  const last5 = seq.slice(0,5).map(s => s==='tai'?'T':'X').join(' ');
  const last10 = seq.slice(0,10).map(s => s==='tai'?'T':'X').join(' ');

  // "cầu" đơn giản: đếm cặp 1-1, 2-2 trong 10 phiên gần nhất
  const last10arr = seq.slice(0,10);
  let c11 = 0, c22 = 0;
  for (let i=0;i<last10arr.length-1;i++) {
    if (last10arr[i] !== last10arr[i+1]) c11++;
    if (i<last10arr.length-2 && last10arr[i]===last10arr[i+1] && last10arr[i+1]!==last10arr[i+2]) c22++;
  }

  $streak.innerHTML = `
    <div class="card">
      <div class="row"><span>Chuỗi hiện tại</span>
        <span class="${cur}">${cur==='tai'?'TÀI':'XỈU'} × ${len}</span></div>
      <div class="row"><span>Chuỗi dài nhất (trong dữ liệu)</span>
        <span class="${maxRun.side}">${maxRun.side==='tai'?'TÀI':'XỈU'} × ${maxRun.len}</span></div>
      <div class="row"><span>5 phiên gần nhất</span><b>${last5}</b></div>
      <div class="row"><span>10 phiên gần nhất</span><b>${last10}</b></div>
      <div class="row"><span>Cầu 1-1 (10 phiên)</span><b>${c11} lần đổi</b></div>
      <div class="row"><span>Cầu 2-2 (10 phiên)</span><b>${c22} lần gãy</b></div>
    </div>
    <div class="note">
      Đây là <b>mô tả dữ liệu quá khứ</b>. Chuỗi dài/ngắn <b>không</b> dự báo phiên sau —
      mỗi phiên RNG độc lập xác suất ~50/50.
    </div>
  `;
}

/* ============================================================
   RENDER DANH SÁCH
   ============================================================ */
function renderList(items) {
  if (!items.length) { $list.innerHTML = '<div class="card">Không có dữ liệu</div>'; return; }
  $list.innerHTML = items.slice(0, CONFIG.MAX_ITEMS).map((it, idx) => `
    <div class="card">
      <div class="row"><span>#${idx+1} · Phiên</span><b>${esc(it.id ?? '-')}</b></div>
      <div class="row"><span>Kết quả</span>
        <span class="${it.side || ''}">${esc(it.raw ?? (it.side==='tai'?'TÀI':it.side==='xiu'?'XỈU':'-'))}</span></div>
      ${it.sum != null ? `<div class="row"><span>Tổng</span><b>${esc(it.sum)}</b></div>` : ''}
      ${it.dice ? `<div class="row"><span>Xúc xắc</span><b>${esc(arrStr(it.dice))}</b></div>` : ''}
    </div>`).join('');
}

/* ============================================================
   HELPERS
   ============================================================ */
function extractList(data) {
  if (!data) return [];
  if (Array.isArray(data)) return data;
  for (const k of ['data','sessions','items','list','results','records']) {
    if (Array.isArray(data[k])) return data[k];
    if (data[k] && Array.isArray(data[k].list))   return data[k].list;
    if (data[k] && Array.isArray(data[k].items))  return data[k].items;
    if (data[k] && Array.isArray(data[k].data))   return data[k].data;
  }
  return [data];
}
function pick(obj, keys) {
  if (!obj || typeof obj !== 'object') return undefined;
  for (const k of keys) {
    if (obj[k] !== undefined) return obj[k];
    for (const ok of Object.keys(obj))
      if (ok.toLowerCase() === k.toLowerCase()) return obj[ok];
  }
}
function arrStr(v) {
  if (Array.isArray(v)) return v.map(x => typeof x==='object'?JSON.stringify(x):x).join(' · ');
  return v;
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============================================================
   AUTO REFRESH + EVENTS
   ============================================================ */
function toggleAuto() {
  if (autoTimer) {
    clearInterval(autoTimer); autoTimer = null;
    btnAuto.textContent = '▶ Auto 10s'; btnAuto.classList.add('ghost');
  } else {
    autoTimer = setInterval(load, CONFIG.AUTO_MS);
    btnAuto.textContent = '⏸ Dừng auto'; btnAuto.classList.remove('ghost');
    load();
  }
}
btnLoad.addEventListener('click', load);
btnAuto.addEventListener('click', toggleAuto);
load();
</script>
</body>
</html>
